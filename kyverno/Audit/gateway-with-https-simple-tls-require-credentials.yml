# https://github.com/ethanolivertroy/snowcat/blob/main/auditors/gateway/insecure_tls.go#L58-L69

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gateway-with-https-simple-tls-require-credentials
  annotations:
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Gateway
    policies.kyverno.io/description: >-
      This policy ensures that Istio Gateway resources configured with 
      TLS mode set to SIMPLE specify either a credentialName referencing a 
      Kubernetes secret or both serverCertificate and privateKey fields. 
      This validation prevents misconfigurations that could lead to insecure or 
      non-functional HTTPS endpoints.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  # Проверка: SIMPLE TLS без указания сертификатов или credentialName
  # Нужно проверять только Istio Gateway, так как в k8s-gateway-api по умолчанию
  # проверяется наличие certificateRefs
    - name: require-tls-credentials-for-istio-gateway-in-simple-mode
      match:
        any:
        - resources:
            kinds:
              - Gateway
      preconditions:
        all:
        - key: "{{ request.operation || 'BACKGROUND' }}"
          operator: AnyIn
          value: ["CREATE", "UPDATE"]
      validate:
        message: "TLS in SIMPLE mode must have credentialName or certificate and privateKey set"
        foreach:
        - list: "request.object.spec.servers[]"
          preconditions:
            all:
            - key: "{{ element.port.protocol }}"
              operator: Equals
              value: "HTTPS"
            - key: "{{ element.tls.mode || '' }}"
              operator: Equals
              value: "SIMPLE"
          anyPattern:
          - tls:
              credentialName: "?*"
          - tls:
              serverCertificate: "?*"
              privateKey: "?*"