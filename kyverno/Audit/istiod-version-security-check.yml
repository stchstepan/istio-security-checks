apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: istiod-version-security-check
  annotations:
    policies.kyverno.io/category: Security
    policies.kyverno.io/subject: Gateway
    policies.kyverno.io/description: >-
      This policy checks for known vulnerable versions of Istio by inspecting 
      the version of the Istiod container images in the istio-system namespace.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: ISTIO-SECURITY-2024-007
      match:
        any:
        - resources:
            kinds:
              - Pod
      preconditions:
        all:
        - key: "{{ request.object.metadata.namespace }}"
          operator: Equals
          value: "istio-system"
        - key: "{{ request.object.metadata.name }}"
          operator: AnyIn
          value: "*istiod*"
      validate:
        message: "Check https://istio.io/latest/news/security/istio-security-2024-007/ for details."
        deny:
          conditions:
            all:
            - key: "{{ request.object.spec.containers[].image }}"
              operator: AnyIn
              value:
                - "*1.22.6*"
                - "*1.22.5*"
                - "*1.22.4*"
                - "*1.22.3*"
                - "*1.22.2*"
                - "*1.22.1*"
                - "*1.22.0*"
