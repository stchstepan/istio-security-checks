---
# Для productpage (явное разрешение)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: productpage-allow
  namespace: bookinfo
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: productpage
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/bookinfo/sa/bookinfo-productpage"]  # Используем реальный SA
    to:
    - operation:
        methods: ["GET"]  # Только GET как в HTTPRoute
        paths: ["/productpage", "/static/*", "/login", "/logout", "/api/v1/products*"]  # Реальные пути

---
# Для details service
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: details-allow
  namespace: bookinfo
spec:
  action: ALLOW
  selector:
    matchLabels:
      app: details
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/bookinfo/sa/bookinfo-details"]  # Реальный SA
    to:
    - operation:
        ports: ["9080"]  # Реальный порт из Service

