---
# Для ingress gateway
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow
  namespace: bookinfo
spec:
  action: ALLOW
  selector:
    matchLabels:
      istio: ingressgateway
  rules:
  - to:
    - operation:
        ports: ["80"]  # Порт из Gateway
        hosts: ["*"]  # Или конкретный хост, если известен